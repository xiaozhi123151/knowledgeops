[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledgeops"
version = "0.1.0"
description = "Evidence-grounded research with hybrid retrieval and a durable agent harness"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.18", "httpx>=0.28,<1", "openai>=1.60,<3",
  "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "qdrant-client>=1.17,<1.18", "redis>=5,<7", "rank-bm25>=0.2.2,<0.3",
  "jieba>=0.42.1,<0.43", "pypdf>=5,<7", "beautifulsoup4>=4.12,<5",
  "numpy>=1.26,<3", "tiktoken>=0.8,<1",
]

[project.optional-dependencies]
models = ["sentence-transformers>=3.4,<6", "torch>=2.6,<3"]
trace = ["langfuse>=3,<4"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "reportlab>=4,<5", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
markers = ["live: requires explicitly configured external services", "process: starts and terminates real processes",
           "deepseek_live: real official DeepSeek API; skips without credentials; may incur API charges",
           "retrieval_live: real local model weights and Qdrant Server; explicit opt-in"]
filterwarnings = ["ignore:pkg_resources is deprecated:UserWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/knowledgeops"]

[tool.hatch.build]
include = ["src/knowledgeops/**/*.py", "src/knowledgeops/web/*", "src/knowledgeops/providers/*.tiktoken"]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# Linux deployment is CPU by default; do not pull multi-GB CUDA runtime wheels.
# Windows CUDA experiments retain their separately pinned environment.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
